<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽選デモ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    #status {
      margin-bottom: 16px;
      color: #666;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background: #ddd;
    }

    .placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      background: #ddd;
    }

    .name {
      font-weight: bold;
      margin-top: 8px;
    }

    .price {
      font-size: 18px;
      margin-top: 4px;
    }

    .description {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .winners {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #06c755;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>今月の抽選商品</h1>

  <div id="status">
    LINE情報を確認しています...
  </div>

  <div id="products" class="grid"></div>

  <script>
    const LIFF_ID = '2011452774-69ShBQM0';

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxIYbJsyLV2nqI5-bXPUDNuajQUCu83ADaR3WZbwKjmiyKPvTUXH8DishjH6mxwxv_EVw/exec';

    let currentUser = null;

    async function start() {
      const status = document.getElementById('status');

      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        currentUser = {
          userId: profile.userId,
          displayName: profile.displayName
        };

        status.textContent =
          'ログイン中：' + currentUser.displayName + ' さん';

        await loadProducts();

      } catch (error) {
        console.error(error);

        status.textContent =
          'エラー：' + (error.message || String(error));
      }
    }

    async function loadProducts() {
      const response = await fetch(
        API_URL + '?action=products'
      );

      const data = await response.json();

      if (!data.success) {
        throw new Error('商品情報を取得できませんでした。');
      }

      showProducts(data.products);
    }

    function showProducts(products) {
      const container = document.getElementById('products');

      container.innerHTML = '';

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'card';

        const imageHtml =
          product.imageUrl &&
          product.imageUrl !== '画像URL'
            ? `<img class="image" src="${product.imageUrl}">`
            : `<div class="placeholder"></div>`;

        card.innerHTML = `
          ${imageHtml}

          <div class="name">
            ${product.name}
          </div>

          <div class="price">
            ¥${Number(product.price).toLocaleString()}
          </div>

          <div class="description">
            ${product.description || ''}
          </div>

          <div class="winners">
            当選 ${product.winners}名
          </div>

          <button onclick="selectProduct('${escapeText(product.name)}')">
            この商品に応募
          </button>
        `;

        container.appendChild(card);
      });
    }

    function selectProduct(productName) {
      alert(
        productName +
        ' を選択しました。\n\n次に応募保存処理を追加します。'
      );
    }

    function escapeText(text) {
      return String(text)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
    }

    start();
  </script>

</body>
</html>
