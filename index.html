<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽選デモ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    #status {
      margin-bottom: 24px;
      color: #666;
      font-size: 14px;
    }

    /* カテゴリ全体 */
    .category-section {
      margin-bottom: 32px;
    }

    /* カテゴリ見出し */
    .category-title {
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 12px 2px;
      padding-left: 10px;
      border-left: 4px solid #06c755;
    }

    /* 商品一覧 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* 商品カード */
    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background: #ddd;
    }

    .placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      background: #ddd;
    }

    .name {
      font-weight: bold;
      margin-top: 8px;
    }

    .price {
      font-size: 18px;
      margin-top: 4px;
    }

    .description {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .winners {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #06c755;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>今月の抽選商品</h1>

  <div id="status">
    LINE情報を確認しています...
  </div>

  <div id="products"></div>


  <script>

    const LIFF_ID = '2011452774-69ShBQM0';

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxIYbJsyLV2nqI5-bXPUDNuajQUCu83ADaR3WZbwKjmiyKPvTUXH8DishjH6mxwxv_EVw/exec';

    let currentUser = null;


    /* =========================================
       起動
    ========================================= */

    async function start() {

      const status =
        document.getElementById('status');

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        const profile =
          await liff.getProfile();


        currentUser = {

          userId:
            profile.userId,

          displayName:
            profile.displayName

        };


        status.textContent =
          'ログイン中：' +
          currentUser.displayName +
          ' さん';


        await loadProducts();


      } catch (error) {

        console.error(error);

        status.textContent =
          'エラー：' +
          (
            error.message ||
            String(error)
          );

      }

    }



    /* =========================================
       商品取得
    ========================================= */

    async function loadProducts() {

      const response =
        await fetch(
          API_URL +
          '?action=products'
        );


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          '商品情報を取得できませんでした。'
        );

      }


      showProducts(
        data.products
      );

    }



    /* =========================================
       商品表示
    ========================================= */

    function showProducts(products) {

      const container =
        document.getElementById(
          'products'
        );


      container.innerHTML = '';


      /*
        表示するカテゴリの順番
      */

      const categoryOrder = [

        'No.6',

        'Colors',

        'PRIVATE LAB',

        '特別品'

      ];


      /*
        カテゴリごとに表示
      */

      categoryOrder.forEach(
        categoryName => {


          const categoryProducts =
            products.filter(
              product =>
                String(
                  product.category || ''
                ).trim()
                === categoryName
            );


          /*
            商品が0件のカテゴリは
            見出しごと表示しない
          */

          if (
            categoryProducts.length === 0
          ) {

            return;

          }


          /* -------------------------
             カテゴリ全体
          ------------------------- */

          const section =
            document.createElement(
              'section'
            );


          section.className =
            'category-section';



          /* -------------------------
             カテゴリ見出し
          ------------------------- */

          const title =
            document.createElement(
              'h2'
            );


          title.className =
            'category-title';


          title.textContent =
            categoryName;


          section.appendChild(
            title
          );



          /* -------------------------
             商品グリッド
          ------------------------- */

          const grid =
            document.createElement(
              'div'
            );


          grid.className =
            'grid';



          /* -------------------------
             商品カード
          ------------------------- */

          categoryProducts.forEach(
            product => {


              const card =
                document.createElement(
                  'div'
                );


              card.className =
                'card';



              const imageHtml =

                product.imageUrl &&
                product.imageUrl !==
                  '画像URL'

                  ? `
                    <img
                      class="image"
                      src="${product.imageUrl}"
                      alt="${escapeHtml(product.name)}"
                    >
                  `

                  : `
                    <div
                      class="placeholder"
                    ></div>
                  `;



              card.innerHTML = `

                ${imageHtml}

                <div class="name">
                  ${escapeHtml(product.name)}
                </div>

                <div class="price">
                  ¥${Number(
                    product.price
                  ).toLocaleString()}
                </div>

                <div class="description">
                  ${escapeHtml(
                    product.description || ''
                  )}
                </div>

                <div class="winners">
                  当選 ${product.winners}名
                </div>

                <button
                  class="apply-button"
                >
                  この商品に応募
                </button>

              `;


              /*
                応募ボタン
              */

              const button =
                card.querySelector(
                  '.apply-button'
                );


              button.addEventListener(
                'click',
                () => {

                  selectProduct(
                    product.name
                  );

                }
              );


              grid.appendChild(
                card
              );

            }
          );


          section.appendChild(
            grid
          );


          container.appendChild(
            section
          );

        }
      );

    }



    /* =========================================
       応募処理
    ========================================= */

    async function selectProduct(
      productName
    ) {


      if (!currentUser) {

        alert(
          'LINEユーザー情報を取得できていません。'
        );

        return;

      }


      const ok =
        confirm(

          productName +
          ' に応募しますか？\n\n' +

          '※応募できるのは月1回です。'

        );


      if (!ok) {

        return;

      }


      try {


        const response =
          await fetch(
            API_URL,
            {

              method: 'POST',

              body:
                JSON.stringify({

                  action:
                    'apply',

                  userId:
                    currentUser.userId,

                  displayName:
                    currentUser.displayName,

                  productName:
                    productName

                })

            }
          );


        const data =
          await response.json();


        if (data.success) {

          alert(
            '🎉 ' +
            data.message
          );

        } else {

          alert(
            '⚠️ ' +
            data.message
          );

        }


      } catch (error) {


        console.error(
          error
        );


        alert(

          '応募処理でエラーが発生しました。\n' +

          error.message

        );

      }

    }



    /* =========================================
       HTMLエスケープ
    ========================================= */

    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }



    /* =========================================
       開始
    ========================================= */

    start();

  </script>

</body>
</html>
